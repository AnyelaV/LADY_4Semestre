<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Barra de Progreso Circular</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="progress-section">

        <h1>Mi progreso</h1>
        <p class="subtitle">Visualiza el porcentaje de avance</p>

        <div class="progressbar-container">

            <div class="outer-box">

                <!-- Porcentaje central -->
                <div class="inner-box">
                    <span class="percentage">50%</span>
                    <span class="label">Completado</span>
                </div>

                <!-- Círculo de progreso -->
                <svg
                    class="progress-svg"
                    width="220"
                    height="220"
                    viewBox="0 0 200 200"
                    aria-label="Progreso del 50 por ciento"
                    role="img"
                >

                    <defs>
                        <linearGradient
                            id="gradientColor"
                            x1="0"
                            y1="0"
                            x2="1"
                            y2="1"
                        >
                            <stop offset="0%" stop-color="#ff4d8d"/>
                            <stop offset="100%" stop-color="#7950f2"/>
                        </linearGradient>
                    </defs>

                    <!-- Círculo de fondo -->
                    <circle
                        class="progress-background"
                        cx="100"
                        cy="100"
                        r="80"
                    />

                    <!-- Círculo animado -->
                    <circle
                        class="progress-value"
                        cx="100"
                        cy="100"
                        r="80"
                    />

                </svg>

            </div>

        </div>

        <p class="footer-text">
            ¡Sigue adelante, estás progresando!
        </p>

    </main>

</body>
</html>

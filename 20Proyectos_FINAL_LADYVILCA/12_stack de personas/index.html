<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stack de Personas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="contenedor">
        <h2>Equipo de trabajo</h2>
        <p class="descripcion">Conoce a los integrantes de nuestro equipo</p>

        <div class="personas-container">

            <div class="persona">
                <img src="profile1.jpeg" alt="Marco Rivas">
                <span class="name">
                    <span class="text">Marco Rivas</span>
                </span>
            </div>

            <div class="persona">
                <img src="profile2.jpeg" alt="Jhojan Lopez">
                <span class="name">
                    <span class="text">Jhojan Lopez</span>
                </span>
            </div>

            <div class="persona">
                <img src="profile3.jpeg" alt="Dani Merlamente">
                <span class="name">
                    <span class="text">Dani Merlamente</span>
                </span>
            </div>

            <div class="persona">
                <img src="profile4.jpeg" alt="Cordoba Vicenten">
                <span class="name">
                    <span class="text">Cordoba Vicenten</span>
                </span>
            </div>

            <div class="persona">
                <img src="profile5.jpeg" alt="Manuel Canchez">
                <span class="name">
                    <span class="text">Manuel Canchez</span>
                </span>
            </div>

        </div>
    </main>

</body>
</html>

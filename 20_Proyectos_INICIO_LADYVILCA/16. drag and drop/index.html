<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drag and Drop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="upload-container">
        <div class="title">UPLOAD FILES</div>
        <div class="description">
            upload the files you want share with your team
        </div>
        <div class="drag-drop">
            <div class="icon">

            </div>
            <div>
                Drag and Drop the files here <br /> 
                Or
            </div>

            <button class="btn">Browse Files</button>
        </div>

        <div class="title-section">UPLOADED FILES</div>
        <div class="uploaded-files">
            <div class="file">
                <div class="icon">
                    <img src="word icon.jpg" alt="">
                </div>
                <div class="title">
                    <div class="name">Documento Importante.pdf</div>
                    <div class="progress">
                        <div class="progress-60"></div>
                    </div>
                </div>
                <div class="actions">
                    <button>X</button>
                </div>
            </div>

            <div class="file">
                <div class="icon">
                    <img src="word icon.jpg" alt="">
                </div>
                <div class="title">
                    <div class="name">Document.pdf</div>
                    <div class="size">60 kb</div>
                </div>
                <div class="actions">
                    <button>X</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

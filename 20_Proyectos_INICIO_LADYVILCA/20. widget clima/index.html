<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wigdet Clima</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="weather-container">
        <div class="current">
            <div class="city">Mexico city</div>
            <div class="day">Now</div>
            <div class="row">
                <div class="icon">
                    <img src="cloudy.jpg" width="128" alt="">
                </div>
                <div class="info">
                    <div class="temperature">
                        <div class="temperature-now">20°</div>
                        <div class="temperature-low">17°</div>
                    </div>

                    <div class="status">Partially Cloudy</div>
                </div>
            </div>
            <div class="more">
                <div class="item">
                   <div class="icon">
                        <span class="material-icons">Wader</span>
                   </div>
                   <div class="text">
                        <div class="value">9 km/h</div>
                        <div class="type">Wind</div>
                   </div>
                </div>
                <!--ITEM-->
                <div class="item">
                   <div class="icon">
                        <span class="material-icons">air</span>
                   </div>
                   <div class="text">
                        <div class="value">93%</div>
                        <div class="type">Change of  rain</div>
                   </div>
                </div>
                <!--ITEM-->
                <div class="item">
                   <div class="icon">
                        <span class="material-icons">Wader</span>
                   </div>
                   <div class="text">
                        <div class="value">31%</div>
                        <div class="type">Humidity</div>
                   </div>
                </div>
                <!--ITEM-->
            </div>
        </div>
        <!--CURRENT-->

        <div class="list">
            <div class="day">
                <div class="name">Mon</div>
                <div class="wather">
                    <div class="icon">
                        <span class="material-icons">wb_cloudy</span>
                    </div>
                    <div class="status">Cloudy</div>
                
                </div>
                <div class="temperature">
                    <div class="temperature-high">20°</div>
                    <div class="temperature-low">17°</div>
                </div>
            </div>
            <!--DAY-->
            <div class="day">
                <div class="name">Tue</div>
                <div class="wather">
                    <div class="icon">
                        <span class="material-icons">ac_unit</span>
                    </div>
                    <div class="status">Snow</div>
                    
                </div>
                <div class="temperature">
                    <div class="temperature-high">20°</div>
                    <div class="temperature-low">-17°</div>
                </div>
            </div>
            <!--DAY-->
            <div class="day">
                <div class="name">Web</div>
                <div class="wather">
                    <div class="icon">
                        <span class="material-icons">wb_thunderstorm</span>
                    </div>
                    <div class="status">thunderstorm</div>
                    
                </div>
                <div class="temperature">
                    <div class="temperature-high">20°</div>
                    <div class="temperature-low">17°</div>
                </div>
            </div>
            <!--DAY-->
            <div class="day">
                <div class="name">Thu</div>
                <div class="wather">
                    <div class="icon">
                        <span class="material-icons">wb_twiligth</span>
                    </div>
                    <div class="status">Twiligth</div>
                    
                </div>
                <div class="temperature">
                    <div class="temperature-high">20°</div>
                    <div class="temperature-low">17°</div>
                </div>
            </div>
            <!--DAY-->
            <div class="day">
                <div class="name">Fri</div>
                <div class="wather">
                    <div class="icon">
                        <span class="material-icons">wb_sunny</span>
                    </div>
                    <div class="status">Sunny</div>
                    
                </div>
                <div class="temperature">
                    <div class="temperature-high">25°</div>
                    <div class="temperature-low">17°</div>
                </div>
            </div>
            <!--DAY-->
        </div>
        <!--LIST-->
    </div>
</body>
</html>

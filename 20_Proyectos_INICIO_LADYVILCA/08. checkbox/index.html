<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Checkbox y radio button</title>
    <link 
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <label class="checkbox-container"> Soy un Checkbox
        <input type="checkbox" name="" id="">
        <span class="checkbox">
            <div class="material-icons">Check</div>
        </span>
    </label>

    <label class="checkbox-container"> 
        Soy un radio button
        <input type="radio" name="a" id="">
        <span class="checkbox radio">
            <div class="circle"></div>
        </span>
    </label>

    <label class="checkbox-container"> 
        Soy un radio button
        <input type="radio" name="a" id="">
        <span class="checkbox radio">
            <div class="circle"></div>
        </span>
    </label>
</body>
</html>
